<div class="min-h-screen bg-gray-900 text-white flex flex-col p-4 items-center font-sans">
  
  <div *ngIf="state.completed" class="text-center mt-20">
    <h1 class="text-4xl font-bold text-green-400 mb-4">Você venceu todas as fases!</h1>
    <button (click)="engine.resetGame()" class="bg-blue-500 hover:bg-blue-600 px-6 py-3 rounded-xl text-xl font-bold shadow-lg">Jogar Novamente</button>
  </div>

  <div *ngIf="!state.completed && currentTask" class="w-full max-w-4xl flex flex-col items-center">
    
    <!-- Header -->
    <div class="w-full flex justify-between items-center bg-gray-800 p-4 rounded-2xl mb-8 shadow-md border border-gray-700">
      <div>
        <h2 class="text-xl font-bold text-blue-300">Módulo {{ state.module + 1 }}: {{ moduleNames[state.module] }}</h2>
        <p class="text-gray-400">Tarefa {{ state.taskIndex + 1 }} / 10</p>
      </div>
      <div class="flex space-x-2 text-red-500 text-3xl">
        <i *ngFor="let _ of [].constructor(state.hearts)" class="fas fa-heart drop-shadow-md"></i>
        <i *ngFor="let _ of [].constructor(3 - state.hearts)" class="far fa-heart text-gray-600 drop-shadow-md"></i>
      </div>
    </div>

    <!-- Question -->
    <h3 class="text-3xl font-extrabold text-center mb-8 drop-shadow-lg text-white">
      {{ currentTask.question }}
    </h3>

    <!-- Módulo 1: Qual é a Cor? -->
    <div *ngIf="currentTask.type === 'color'" class="grid grid-cols-2 gap-6 w-full max-w-md">
      <div *ngFor="let opt of currentTask.data.options" 
           (click)="handleColorTap(opt)"
           class="h-32 rounded-3xl shadow-xl cursor-pointer border-4 border-gray-700 hover:scale-105 transition-transform"
           [style.background-color]="opt.code">
      </div>
    </div>

    <!-- Módulo 2: Padrão -->
    <div *ngIf="currentTask.type === 'pattern'" class="w-full flex flex-col items-center">
      <div class="flex space-x-4 mb-12">
        <div *ngFor="let c of currentTask.data.pattern" 
             class="w-20 h-20 rounded-xl shadow-md border-2 border-gray-600 flex items-center justify-center text-4xl"
             [ngStyle]="{'background-color': c || '#374151'}">
          <span *ngIf="!c">?</span>
        </div>
      </div>
      
      <div class="grid grid-cols-2 gap-6 w-full max-w-md">
        <div *ngFor="let opt of currentTask.data.options" 
             (click)="handlePatternTap(opt)"
             class="h-24 rounded-2xl shadow-lg cursor-pointer border-4 border-gray-700 hover:scale-105 transition-transform"
             [style.background-color]="opt">
        </div>
      </div>
    </div>

    <!-- Módulo 3: Simetria -->
    <div *ngIf="currentTask.type === 'symmetry'" class="w-full flex flex-col items-center">
      
      <div class="mb-8 w-24 h-24 rounded-xl shadow-lg cursor-grab border-4 border-white animate-pulse"
           draggable="true" 
           (dragstart)="onDragStart($event, {color: currentTask.data.dragColor})"
           [style.background-color]="currentTask.data.dragColor">
      </div>

      <div class="grid grid-cols-3 gap-2 bg-gray-800 p-4 rounded-2xl">
        <div *ngFor="let cell of currentTask.data.grid; let i = index"
             class="w-20 h-20 rounded-md border-2"
             [ngClass]="cell ? 'border-gray-600' : 'border-dashed border-gray-500'"
             [style.background-color]="cell || 'transparent'"
             (dragover)="onDragOver($event)"
             (drop)="onDropSymmetry($event, i)">
        </div>
      </div>
    </div>

    <!-- Módulo 4: Coordenadas -->
    <div *ngIf="currentTask.type === 'coordinates'" class="w-full flex flex-col items-center">
      <div class="grid grid-cols-3 gap-2 bg-gray-800 p-6 rounded-3xl shadow-xl relative">
        <div *ngFor="let _ of [].constructor(currentTask.data.gridSize); let r = index" class="contents">
          <div *ngFor="let _ of [].constructor(currentTask.data.gridSize); let c = index"
               (click)="handleCoordinateTap(r, c)"
               class="w-24 h-24 bg-gray-700 hover:bg-gray-600 rounded-lg cursor-pointer border-2 border-gray-600 flex items-center justify-center text-gray-500 text-sm">
            {{r+1}},{{c+1}}
          </div>
        </div>
      </div>
    </div>

    <!-- Módulo 5: Pintor Digital -->
    <div *ngIf="currentTask.type === 'painter'" class="w-full flex flex-col items-center">
      <div class="flex space-x-8 mb-12">
        <div *ngFor="let drag of currentTask.data.draggables"
             draggable="true"
             (dragstart)="onDragStart($event, drag)"
             class="w-24 h-24 rounded-full shadow-lg cursor-grab border-4 border-white"
             [style.background-color]="drag.color">
        </div>
      </div>

      <div class="flex space-x-8">
        <div *ngFor="let zone of currentTask.data.zones"
             (dragover)="onDragOver($event)"
             (drop)="onDropPainter($event, zone.id)"
             class="w-32 h-40 rounded-2xl border-4 border-dashed border-gray-500 flex flex-col items-center justify-center p-2"
             [style.background-color]="painterMatches[zone.id] || 'transparent'">
          <span class="text-xl font-bold bg-black bg-opacity-50 px-2 py-1 rounded" 
                [ngClass]="painterMatches[zone.id] ? 'text-white' : 'text-gray-400'">
            {{ zone.name }}
          </span>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="min-h-screen bg-gray-50 flex flex-col justify-center items-center font-sans p-4">
  
  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md text-center border border-gray-200">
    
    <h1 class="text-3xl font-bold text-forest-900 mb-2">Boebel Games</h1>
    <p class="text-gray-500 mb-8 text-sm">Digite seu nome e o código de acesso fornecido pelo professor</p>

    <!-- Dentro do seu formulário de login -->
  <div class="mb-4">
    <label class="block text-gray-700 font-bold mb-2">Seu Nome:</label>
    <input 
      type="text" 
      [(ngModel)]="studentName" 
      name="studentName"
      placeholder="Digite seu nome (Ex: João)"
      class="w-full px-4 py-3 rounded-lg border-2 border-gray-300 focus:border-blue-500 focus:ring-4 focus:ring-blue-200 transition-all text-xl"
      required>
  </div>

  <div class="mb-6">
    <label class="block text-gray-700 font-bold mb-2">Código da Turma:</label>
    <input 
      type="text" 
      [(ngModel)]="ticketCode" 
      name="ticketCode"
      placeholder="Ex: A7X9"
      class="w-full px-4 py-3 rounded-lg border-2 border-gray-300 focus:border-forest-500 focus:ring-4 focus:ring-forest-200 transition-all text-xl uppercase font-mono"
      required>
  </div>

    <!-- Mensagem de Erro (Usando o mesmo padrão de erro do dashboard) -->
    <div *ngIf="errorMessage" class="bg-red-50 text-red-600 p-3 rounded-lg mb-6 text-sm text-center">
      {{ errorMessage }}
    </div>

    <!-- Botão de Ação -->
    <button
      (click)="onEnterGame()"
      [disabled]="isLoading || ticketCode.length < 6"
      class="w-full py-4 bg-forest-900 hover:bg-forest-800 text-white font-bold text-lg rounded-lg transition-colors disabled:bg-gray-300 disabled:cursor-not-allowed">
      {{ isLoading ? 'Validando...' : 'Acessar Jogo' }}
    </button>

  </div>
</div>

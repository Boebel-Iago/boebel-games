<div class="flex items-center justify-center min-h-screen bg-gray-50 font-sans p-4">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md border border-gray-100">
      
      <div class="text-center mb-8">
        <h2 class="text-3xl font-extrabold text-forest-900 mb-2">Boebel Games</h2>
        <p class="text-sm text-gray-500 mt-1">Acesso do Professor</p>
      </div>
  
      <div class="mb-5">
        <label for="email" class="block mb-2 text-sm font-semibold text-gray-700">E-mail</label>
        <input id="email" type="email" formControlName="email" placeholder="admin@escola.com"
               class="w-full px-4 py-3 border border-gray-300 rounded-xl text-md focus:outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-50 transition-all">
      </div>
  
      <div class="mb-6">
        <label for="password" class="block mb-2 text-sm font-semibold text-gray-700">Senha</label>
        <input id="password" type="password" formControlName="password" placeholder="Sua senha secreta"
               class="w-full px-4 py-3 border border-gray-300 rounded-xl text-md focus:outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-50 transition-all">
      </div>
  
      <div *ngIf="errorMessage" class="mb-6 p-3 bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg text-center font-medium">
        {{ errorMessage }}
      </div>
  
      <button type="submit" [disabled]="loginForm.invalid"
              class="w-full py-4 bg-forest-900 hover:bg-forest-800 text-white font-bold text-lg rounded-xl shadow-md hover:shadow-lg transition-all disabled:bg-gray-300 disabled:shadow-none disabled:cursor-not-allowed">
        Entrar no Sistema ➡️
      </button>

      <div class="mt-6 text-center">
        <a routerLink="/" class="text-emerald-700 hover:text-emerald-800 text-sm font-bold hover:underline transition-colors">
          Sou aluno e quero entrar em uma turma
        </a>
      </div>
      
    </form>
  </div>

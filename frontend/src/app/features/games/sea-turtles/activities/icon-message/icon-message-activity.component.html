<div class="flex flex-col items-center gap-8 w-full py-4">

    <p class="text-slate-400 text-sm font-bold uppercase tracking-wide text-center">
      Mensagem: "{{ phase.targetMessage }}"
    </p>
  
    <!-- Mensagem sendo montada -->
    <div class="flex flex-wrap justify-center gap-2 min-h-[90px] bg-slate-900/60 rounded-2xl px-4 py-4 border-2 border-slate-700 w-full max-w-2xl">
      <div *ngFor="let icon of placedIcons"
           class="flex flex-col items-center gap-1 bg-emerald-900/40 border-2 border-emerald-600 rounded-xl p-2 w-20">
        <span class="text-3xl">{{ icon.emoji }}</span>
      </div>
      <p *ngIf="placedIcons.length === 0" class="text-slate-500 text-sm self-center">
        Toque nos ícones certos, na ordem certa, pra montar a mensagem.
      </p>
    </div>
  
    <!-- Ícones disponíveis (com distratores misturados) -->
    <div class="flex flex-wrap justify-center gap-3 max-w-2xl">
      <button *ngFor="let icon of remainingIcons"
              (click)="selectIcon(icon)"
              [title]="icon.meaning"
              class="flex flex-col items-center gap-1 bg-slate-800 border-4 rounded-2xl p-3 w-24 transition-transform"
              [ngClass]="wrongIconId === icon.id ? 'border-red-500' : 'border-slate-700 hover:border-yellow-400 hover:scale-105'">
        <span class="text-4xl">{{ icon.emoji }}</span>
      </button>
    </div>
  
    <p *ngIf="wrongIconId" class="text-red-400 font-bold">Esse não é o próximo ícone da mensagem. Tenta outro!</p>
    <p *ngIf="placedIcons.length === phase.correctSequence.length" class="text-emerald-400 font-black text-xl">
      Mensagem completa! 🎉
    </p>
  </div>

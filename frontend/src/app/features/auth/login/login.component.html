<div class="login-wrapper">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-card">
        <div class="header">
            <h2>Boebel Games</h2>
            <p>Acesso do Professor</p>
        </div>
    
        <div class="input-group">
            <label for="email">E-mail</label>
            <input id="email" type="email" formControlName="email" placeholder="admin@escola.com">
        </div>

        <div class="input-group">
            <label for="password">Senha</label>
            <input id="password" type="password" formControlName="password" placeholder="Sua senha">
        </div>

        <div *ngIf="errorMessage" class="error-message">
            {{ errorMessage }}
        </div>

        <button type="submit" [disabled]="loginForm.invalid">Entrar no Sistema</button>

    </form>
</div>

<div class="min-h-screen bg-gray-50 font-sans">
  <header class="bg-forest-900 text-white px-8 py-4 flex justify-between items-center shadow-md">
    <h2 class="text-lg font-bold">Boebel Games - Painel Administrativo</h2>
    <button (click)="logout()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg cursor-pointer">Sair</button>
  </header>

  <main class="flex justify-center items-center py-12 px-4">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-lg">
      <h3 class="text-xl font-bold text-center mb-2">Gerenciador de Ingressos</h3>
      
      <!-- Formulário de Criação -->
      <form *ngIf="!activeTicket" [formGroup]="ticketForm" (ngSubmit)="onGenerateTicket()" class="space-y-4">
        <div>
          <label class="block mb-1 text-sm font-semibold">Turma (Grade)</label>
          <select formControlName="grade" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
            <option value="" disabled>Selecione a turma...</option>
            <option *ngFor="let g of availableGrades" [value]="g.code">{{ g.name }}</option>
          </select>
        </div>

        <div *ngIf="availableGames.length > 0">
          <label class="block mb-1 text-sm font-semibold">Jogo Disponível</label>
          <div class="space-y-2">
            <div *ngFor="let game of availableGames" 
                 (click)="ticketForm.patchValue({gameId: game.id})"
                 [class.border-forest-800]="ticketForm.value.gameId === game.id"
                 [class.bg-forest-50]="ticketForm.value.gameId === game.id"
                 class="p-3 border border-gray-200 rounded-lg cursor-pointer">
              <h4 class="font-bold text-sm">{{ game.title }}</h4>
              <p class="text-xs">{{ game.description }}</p>
            </div>
          </div>
        </div>

        <div>
          <label class="block mb-1 text-sm font-semibold">Max Uses (Alunos)</label>
          <input type="number" formControlName="maxUses" class="w-full px-4 py-2 border rounded-lg">
        </div>

        <div>
          <label class="block mb-1 text-sm font-semibold">Expiration (Hours)</label>
          <input type="number" formControlName="expirationHours" class="w-full px-4 py-2 border rounded-lg">
        </div>

        <button type="submit" [disabled]="ticketForm.invalid"
                class="w-full py-3 bg-forest-900 text-white rounded-lg disabled:bg-gray-300">
          Gerar Ingresso
        </button>
      </form>

      <!-- Card de Ingresso Ativo -->
      <div *ngIf="activeTicket" class="bg-emerald-50 border border-emerald-200 p-6 rounded-xl mt-4">
        <span class="text-xs uppercase font-bold text-emerald-700">Ingresso Ativo ({{ activeTicket.gameTitle }})</span>
        <code class="text-xl font-bold bg-white px-3 py-2 border rounded block text-center mt-2">{{ activeTicket.code }}</code>
        <p class="text-xs text-center mt-2">Turma: {{ activeTicket.grade }} | Usos Restantes: {{ activeTicket.remainingUses }}</p>
        <button (click)="onDeleteTicket(activeTicket.id)" class="w-full py-2 bg-red-600 text-white rounded-lg mt-4">
          Excluir Ingresso
        </button>
      </div>

      <div *ngIf="errorMessage" class="bg-red-50 text-red-600 p-3 rounded-lg mt-4 text-center">
        {{ errorMessage }}
      </div>
    </div>
  </main>
</div>

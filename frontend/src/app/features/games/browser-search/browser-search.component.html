<!-- FASE 1: O NAVEGADOR FAKE -->
<div *ngIf="gameStage === 1 && !gameFinished" class="w-full max-w-4xl bg-white border-2 border-gray-300 rounded-xl shadow-2xl overflow-hidden flex flex-col">
    
    <!-- Barra Superior do Navegador (Abas) -->
    <div class="bg-gray-200 p-2 flex gap-2 border-b border-gray-300 items-end">
      <!-- Botões do Sistema -->
      <div class="flex items-center gap-2 mr-2 pb-1">
        <button (click)="checkBrowserPart('close-tab', $event)" class="w-3 h-3 rounded-full bg-red-400 hover:bg-red-500 cursor-pointer shadow-sm" title="Fechar"></button>
        <div class="w-3 h-3 rounded-full bg-yellow-400 shadow-sm"></div>
        <div class="w-3 h-3 rounded-full bg-green-400 shadow-sm"></div>
      </div>
      
      <!-- Aba Ativa -->
      <div class="bg-white px-4 py-1.5 rounded-t-lg text-xs font-bold text-gray-700 shadow-sm flex items-center gap-2">
        <span>🌍</span> Meu Site
      </div>

      <!-- Nova Guia -->
      <button (click)="checkBrowserPart('new-tab', $event)" class="ml-2 bg-gray-300 hover:bg-gray-400 text-gray-700 font-black w-6 h-6 rounded-full flex items-center justify-center text-xs transition-colors shadow-sm" title="Nova Guia">
        +
      </button>
    </div>

    <!-- Barra de Ferramentas -->
    <div class="bg-gray-100 p-3 flex items-center gap-3 border-b-2 border-gray-300">
      
      <button (click)="checkBrowserPart('back')" class="p-2 bg-white rounded shadow hover:bg-gray-50 hover:scale-105 transition-transform text-xl cursor-pointer" title="Voltar">⬅️</button>
      <button (click)="checkBrowserPart('forward')" class="p-2 bg-white rounded shadow hover:bg-gray-50 hover:scale-105 transition-transform text-xl cursor-pointer" title="Avançar">➡️</button>
      <button (click)="checkBrowserPart('refresh')" class="p-2 bg-white rounded shadow hover:bg-gray-50 hover:scale-105 transition-transform text-xl cursor-pointer" title="Atualizar">🔄</button>
      <button (click)="checkBrowserPart('home')" class="p-2 bg-white rounded shadow hover:bg-gray-50 hover:scale-105 transition-transform text-xl cursor-pointer" title="Página Inicial">🏠</button>
      
      <!-- Barra de Endereços com Botões Internos -->
      <div (click)="checkBrowserPart('address-bar', $event)" class="flex-1 bg-white border border-gray-300 rounded-full px-4 py-2 text-left text-gray-500 hover:border-blue-400 shadow-inner flex items-center justify-between cursor-pointer">
        <div class="flex items-center gap-2">
          <!-- O Cadeado -->
          <button (click)="checkBrowserPart('lock', $event)" class="hover:bg-gray-200 p-1 rounded transition-colors text-lg" title="Site Seguro">🔒</button>
          <span>https://www.meusite.com.br</span>
        </div>
        
        <!-- Favoritos (Estrela) -->
        <button (click)="checkBrowserPart('bookmark', $event)" class="hover:bg-yellow-100 p-1 rounded-full transition-colors text-lg" title="Favoritos">⭐</button>
      </div>

    </div>

    <!-- Corpo da Página com Barra de Pesquisa -->
    <div class="bg-white p-20 flex flex-col items-center justify-center min-h-[300px]">
      <div class="text-6xl font-black text-blue-500 mb-8 tracking-tighter drop-shadow-sm">Buscador<span class="text-yellow-500">Legal</span></div>
      
      <!-- Barra de Pesquisa Central -->
      <button (click)="checkBrowserPart('search-bar')" class="w-full max-w-lg border-2 border-gray-300 rounded-full px-6 py-4 flex items-center gap-3 hover:border-blue-500 hover:shadow-lg hover:scale-105 transition-all cursor-pointer bg-gray-50">
        <span class="text-3xl text-blue-500">🔍</span>
        <span class="text-gray-400 font-medium text-lg">O que você quer procurar na internet?</span>
      </button>
    </div>
  </div>

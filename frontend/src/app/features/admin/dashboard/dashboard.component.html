<div class="min-h-screen bg-gray-50 font-sans">
  <header class="bg-forest-900 text-white px-8 py-4 flex justify-between items-center shadow-md">
    <h2 class="text-lg font-bold">Boebel Games - Painel Administrativo</h2>
    <button (click)="logout()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 text-sm font-medium rounded-lg transition-colors cursor-pointer">
      Sair
    </button>
  </header>

  <main class="flex justify-center items-center py-12 px-4">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-lg border border-gray-100">
      <h3 class="text-xl font-bold text-gray-900 mb-2 text-center">Gerenciador de Tickets</h3>
      <p class="text-gray-600 text-sm mb-6 text-center">Configure os parâmetros para liberar o acesso dos alunos.</p>
      
      <form [formGroup]="ticketForm" (ngSubmit)="onGenerateTicket()" class="space-y-4">
        <div>
          <label class="block mb-1 text-sm font-semibold text-gray-700">Quantidade de Alunos</label>
          <input type="number" formControlName="quantidadeAlunos" 
                 class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-forest-800">
        </div>

        <div>
          <label class="block mb-1 text-sm font-semibold text-gray-700">Expiração (Horas)</label>
          <input type="number" formControlName="expiracaoHoras" 
                 class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-forest-800">
        </div>

        <button type="submit" [disabled]="ticketForm.invalid"
                class="w-full py-3 px-4 bg-forest-900 hover:bg-forest-800 text-white font-semibold rounded-lg shadow transition-all duration-200 disabled:bg-gray-300 disabled:cursor-not-allowed cursor-pointer mt-4">
          Gerar Ticket
        </button>
      </form>

      <div *ngIf="generatedCode" class="bg-emerald-50 border border-emerald-200 text-emerald-800 p-4 rounded-lg flex flex-col gap-2 mt-6">
        <span class="text-xs font-semibold uppercase tracking-wider text-emerald-700">Ticket Gerado:</span>
        <code class="text-lg font-mono font-bold bg-white p-2 rounded border border-emerald-100 select-all">{{ generatedCode }}</code>
      </div>

      <div *ngIf="errorMessage" class="bg-red-50 border border-red-200 text-red-600 p-3 rounded-lg text-sm mt-4 font-medium text-center">
        {{ errorMessage }}
      </div>
    </div>
  </main>
</div>

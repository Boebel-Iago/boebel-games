<div class="min-h-screen bg-blue-50 flex flex-col items-center justify-start p-4 md:p-8 font-sans">
  
  <!-- Header / Status Bar -->
  <div class="w-full max-w-4xl flex justify-between items-center bg-white rounded-xl shadow-md p-4 mb-6">
    <div class="flex items-center space-x-2 text-red-500 text-2xl">
      <i class="fas fa-heart" *ngFor="let h of [].constructor(engine.state.hearts)"></i>
      <i class="far fa-heart text-gray-300" *ngFor="let h of [].constructor(3 - engine.state.hearts)"></i>
    </div>
    <div class="text-center">
      <h1 class="text-xl md:text-2xl font-bold text-blue-900">{{ currentModuleTitle }}</h1>
      <p class="text-sm text-gray-500 font-semibold" *ngIf="currentTask">Tarefa {{ engine.state.taskId + 1 }} de 10</p>
    </div>
    <div class="text-xl font-black text-yellow-500 bg-yellow-100 px-4 py-2 rounded-lg shadow-inner">
      <i class="fas fa-star mr-1"></i> {{ engine.score }}
    </div>
  </div>

  <!-- Game Area -->
  <div class="w-full max-w-4xl bg-white rounded-2xl shadow-lg p-6 md:p-10 relative min-h-[400px] flex flex-col items-center justify-center">
    
    <ng-container *ngIf="currentTask; else finishedTemplate">
      <!-- Prompt -->
      <h2 class="text-2xl md:text-3xl text-center font-extrabold text-gray-800 mb-8">{{ currentTask.prompt }}</h2>

      <!-- TAP TASK -->
      <div *ngIf="currentTask.type === 'tap'" class="w-full grid grid-cols-1 md:grid-cols-2 gap-4">
        <button *ngFor="let option of currentTask.options" 
                (click)="selectOption(option)"
                [disabled]="feedback !== null"
                class="bg-blue-100 hover:bg-blue-200 text-blue-900 font-bold text-xl py-6 px-4 rounded-xl shadow transition-transform transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed border-4 border-transparent hover:border-blue-400">
          {{ option }}
        </button>
      </div>

      <!-- DRAG / DRAG-3 TASK -->
      <div *ngIf="currentTask.type === 'drag' || currentTask.type === 'drag-3'" class="w-full flex flex-col items-center space-y-8">
        
        <!-- Draggable Item -->
        <div class="bg-indigo-600 text-white font-bold text-2xl py-4 px-8 rounded-xl shadow-xl cursor-grab active:cursor-grabbing border-4 border-indigo-800 transform hover:scale-105"
             [draggable]="feedback === null"
             (dragstart)="onDragStart($event, currentTask.item || '')">
          <i class="fas fa-hand-pointer mr-2"></i> {{ currentTask.item }}
        </div>

        <!-- Drop Zones -->
        <div class="w-full flex flex-wrap justify-center gap-4 mt-8">
          <div *ngFor="let zone of currentTask.options"
               class="bg-gray-50 hover:bg-gray-100 border-4 border-dashed border-gray-400 rounded-xl p-8 min-w-[200px] flex-1 text-center font-bold text-xl text-gray-700 transition-colors"
               (dragover)="onDragOver($event)"
               (drop)="onDrop($event, zone)"
               [class.bg-blue-50]="draggedItem !== null"
               [class.border-blue-500]="draggedItem !== null">
            {{ zone }}
          </div>
        </div>
      </div>
    </ng-container>

    <!-- Feedback Overlay -->
    <div *ngIf="feedback" class="absolute inset-0 bg-white bg-opacity-95 rounded-2xl flex flex-col items-center justify-center z-10 p-4 backdrop-blur-sm">
      <div *ngIf="feedback === 'correct'" class="text-green-500 flex flex-col items-center animate-bounce">
        <i class="fas fa-check-circle text-8xl mb-4 drop-shadow-md"></i>
        <h2 class="text-4xl font-black mb-8 text-gray-800">Muito Bem!</h2>
        <button (click)="next()" class="bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-12 rounded-full text-2xl shadow-lg transition-transform transform hover:scale-110 border-b-4 border-green-700">
          Próximo <i class="fas fa-arrow-right ml-2"></i>
        </button>
      </div>
      
      <div *ngIf="feedback === 'wrong'" class="text-red-500 flex flex-col items-center animate-pulse">
        <i class="fas fa-times-circle text-8xl mb-4 drop-shadow-md"></i>
        <h2 class="text-4xl font-black mb-8 text-gray-800">Ops! Tente novamente</h2>
        <button (click)="feedback = null" class="bg-red-500 hover:bg-red-600 text-white font-bold py-4 px-12 rounded-full text-2xl shadow-lg transition-transform transform hover:scale-110 border-b-4 border-red-700">
          Voltar <i class="fas fa-undo ml-2"></i>
        </button>
      </div>
    </div>
    
    <ng-template #finishedTemplate>
      <div class="text-center animate-fade-in">
        <i class="fas fa-trophy text-yellow-500 text-8xl mb-6 drop-shadow-lg"></i>
        <h2 class="text-4xl font-black text-blue-900 mb-4">Você completou todas as missões!</h2>
        <p class="text-xl text-gray-600 mb-8">Sua pontuação final é: <strong class="text-2xl text-yellow-500">{{ engine.score }}</strong></p>
      </div>
    </ng-template>

  </div>
</div>

<div class="min-h-screen bg-gray-50 flex flex-col justify-center items-center font-sans p-4">
  
  <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md border border-gray-100">
    
    <div class="text-center mb-8">
      <h1 class="text-3xl font-extrabold text-forest-900 mb-2 flex justify-center items-center gap-2">
        🎮 Boebel Games
      </h1>
      <p class="text-gray-500 text-sm">Digite seu nome e o código de acesso fornecido pelo professor</p>
    </div>

    <div class="mb-5">
      <label class="block text-gray-700 font-bold mb-2 text-sm">Seu Nome:</label>
      <input 
        type="text" 
        [(ngModel)]="studentName" 
        name="studentName"
        placeholder="Digite seu nome (Ex: João)"
        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-50 transition-all text-lg"
        required>
    </div>

    <div class="mb-6">
      <label class="block text-gray-700 font-bold mb-2 text-sm">Código da Turma:</label>
      <input 
        type="text" 
        [(ngModel)]="ticketCode" 
        name="ticketCode"
        placeholder="Ex: A7X9"
        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:border-emerald-500 focus:ring-4 focus:ring-emerald-50 transition-all text-xl uppercase font-mono tracking-widest text-center"
        required>
    </div>

    <!-- Mensagem de Erro -->
    <div *ngIf="errorMessage" class="bg-red-50 border border-red-200 text-red-600 p-3 rounded-lg mb-6 text-sm text-center font-medium">
      {{ errorMessage }}
    </div>

    <!-- Botão de Ação -->
    <button
      (click)="onEnterGame()"
      [disabled]="isLoading || !studentName || ticketCode.length < 6"
      class="w-full py-4 bg-forest-900 hover:bg-forest-800 text-white font-bold text-lg rounded-xl transition-all shadow-md hover:shadow-lg disabled:bg-gray-300 disabled:shadow-none disabled:cursor-not-allowed">
      {{ isLoading ? 'Validando...' : 'Acessar Jogo ➡️' }}
    </button>
    
    <div class="mt-6 text-center">
      <a routerLink="/free" class="text-emerald-700 hover:text-emerald-800 text-sm font-bold hover:underline transition-colors">
        Quero jogar o modo livre sem código
      </a>
    </div>

  </div>
</div>

version: '3.8'

services:
  postgres:
    image: postgres:16
    env_file:
      - .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: boebelgames
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql

  backend:
    build: ./api
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/boebelgames
      SPRING_DATASOURCE_USERNAME: postgres
      PDF_STORAGE_PATH: /app/pdfs
    volumes:
      - /home/ubuntu/pdfs:/app/pdfs

  frontend:
    build: ./frontend
    ports:
      - "80:80" 
    depends_on:
      - backend

volumes:
  pgdata:

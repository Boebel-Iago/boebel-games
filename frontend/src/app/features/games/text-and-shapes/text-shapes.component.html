<div class="w-full h-full bg-blue-50 relative flex flex-col p-4 select-none">
  
  <!-- Header: Vidas e Módulo -->
  <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-md mb-6 w-full max-w-4xl mx-auto">
    <div class="text-3xl font-bold text-gray-800">
      Módulo {{ state.modulo }} <span class="text-gray-400 text-xl">| Tarefa {{ state.fase + 1 }}/10</span>
    </div>
    <div class="flex gap-2">
      <div *ngFor="let h of [1,2,3]; let i = index" class="text-3xl">
        {{ i < state.vidas ? '❤️' : '🤍' }}
      </div>
    </div>
  </div>

  <div *ngIf="state.completed" class="flex-1 flex flex-col items-center justify-center">
    <div class="text-6xl mb-4">🏆</div>
    <h2 class="text-4xl font-bold text-green-600 mb-4">Parabéns!</h2>
    <p class="text-xl text-gray-600">Você concluiu todos os desafios de Texto e Formas!</p>
  </div>

  <div *ngIf="!state.completed && currentTask" class="flex-1 flex flex-col items-center max-w-4xl mx-auto w-full">
    
    <div class="bg-white rounded-3xl p-8 shadow-lg w-full mb-8 text-center border-4 border-blue-200">
      <h2 class="text-3xl font-bold text-gray-700 mb-2">{{ currentTask.prompt }}</h2>
    </div>

    <!-- Módulo 1: Digitação -->
    <div *ngIf="currentTask.type === 'input'" class="flex flex-col items-center gap-6 w-full">
      <div class="text-6xl font-black text-blue-900 tracking-widest bg-blue-100 px-8 py-4 rounded-2xl border-4 border-blue-300">
        {{ currentTask.word }}
      </div>
      <div class="flex gap-4 items-center w-full max-w-md mt-4">
        <input type="text" [(ngModel)]="inputValue" class="flex-1 text-3xl p-4 rounded-xl border-4 border-gray-300 focus:border-blue-500 text-center uppercase font-bold" placeholder="Digite aqui">
        <button (click)="checkInput()" class="bg-blue-600 text-white font-bold text-2xl px-8 py-4 rounded-xl shadow-lg active:scale-95 transition-transform hover:bg-blue-700">Verificar</button>
      </div>
    </div>

    <!-- Módulo 2: Pintor -->
    <div *ngIf="currentTask.type === 'color'" class="flex flex-col items-center gap-12 w-full">
      <div class="text-7xl font-black text-gray-800 tracking-wider">
        {{ currentTask.word }}
      </div>
      <div class="flex gap-6 justify-center flex-wrap">
        <button *ngFor="let opt of currentTask.options" (click)="checkOption(opt)"
                class="w-32 h-32 rounded-full shadow-xl border-4 border-white active:scale-95 transition-transform hover:scale-105"
                [ngClass]="opt.class"></button>
      </div>
    </div>

    <!-- Módulo 3: Formatação -->
    <div *ngIf="currentTask.type === 'format'" class="flex flex-col items-center gap-12 w-full">
      <div class="text-6xl text-gray-800 tracking-wider">
        {{ currentTask.word }}
      </div>
      <div class="flex gap-8 justify-center">
        <button *ngFor="let opt of currentTask.options" (click)="checkOption(opt)"
                class="w-32 h-32 bg-white rounded-2xl shadow-xl border-4 border-gray-200 flex items-center justify-center text-5xl active:scale-95 transition-transform hover:bg-gray-50 text-gray-800"
                [style]="opt.style">
          A
        </button>
      </div>
    </div>

    <!-- Módulo 4: Forma -->
    <div *ngIf="currentTask.type === 'shape'" class="flex gap-8 justify-center w-full mt-12">
      <button *ngFor="let opt of currentTask.options" (click)="checkOption(opt)"
              class="w-40 h-40 bg-white rounded-3xl shadow-xl border-4 border-gray-200 flex flex-col items-center justify-center gap-4 active:scale-95 transition-transform hover:border-blue-400">
        <i class="fas {{ opt.icon }} text-6xl text-gray-400"></i>
      </button>
    </div>

    <!-- Módulo 5: Combinado -->
    <div *ngIf="currentTask.type === 'combination'" class="grid grid-cols-3 gap-6 w-full max-w-3xl mt-4">
      <button *ngFor="let opt of currentTask.options" (click)="checkOption(opt)"
              class="h-40 bg-white rounded-3xl shadow-md border-4 border-gray-200 flex flex-col items-center justify-center gap-4 active:scale-95 transition-transform hover:shadow-xl">
        <i class="fas {{ opt.icon }} text-7xl" [ngClass]="opt.class"></i>
      </button>
    </div>

  </div>
</div>

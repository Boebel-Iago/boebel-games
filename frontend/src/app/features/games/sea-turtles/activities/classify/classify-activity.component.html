
<!-- Sair da Sala -->
<button (click)="leaveRoom()" class="fixed top-4 left-4 bg-red-500 text-white px-4 py-2 rounded-xl font-bold z-50 shadow-lg hover:bg-red-600 transition-colors border-2 border-red-700">🚪 Sair da Sala</button>
<div class="flex flex-col items-center gap-8 w-full py-4">

    <!-- Itens ainda não classificados -->
    <div class="flex flex-wrap justify-center gap-3 max-w-2xl min-h-[100px]">
      <button *ngFor="let item of remainingItems"
              (click)="selectItem(item)"
              class="flex flex-col items-center gap-1 bg-slate-800 border-4 rounded-2xl p-3 w-24 transition-transform"
              [ngClass]="{
                'border-yellow-400 scale-110': selectedItemId === item.id,
                'border-slate-700 hover:border-slate-500': selectedItemId !== item.id && wrongItemId !== item.id,
                'border-red-500': wrongItemId === item.id
              }">
        <span class="text-4xl">{{ item.emoji }}</span>
        <span class="text-white text-xs font-bold text-center leading-tight">{{ item.label }}</span>
      </button>
  
      <p *ngIf="remainingItems.length === 0" class="text-emerald-400 font-black text-xl">
        Tudo classificado! 🎉
      </p>
    </div>
  
    <!-- Baldes -->
    <div class="flex flex-wrap justify-center gap-8">
      <button *ngFor="let bucket of phase.buckets"
              (click)="selectBucket(bucket.id)"
              [disabled]="!selectedItemId"
              class="flex flex-col items-center gap-2 bg-slate-800 border-4 border-dashed rounded-2xl p-6 w-44 min-h-[180px] transition-colors"
              [ngClass]="selectedItemId ? 'border-yellow-400 hover:bg-slate-700' : 'border-slate-600 opacity-70'">
        <span class="text-5xl">{{ bucket.emoji }}</span>
        <span class="text-white font-black uppercase text-sm">{{ bucket.label }}</span>
        <div class="flex flex-wrap gap-1 justify-center">
          <span *ngFor="let placed of placedItems[bucket.id]" class="text-2xl" [title]="placed.label">
            {{ placed.emoji }}
          </span>
        </div>
      </button>
    </div>
  
    <p *ngIf="!selectedItemId && remainingItems.length > 0" class="text-slate-400 text-sm">
      Toque em um item pra selecionar, depois toque no balde certo.
    </p>
  </div>

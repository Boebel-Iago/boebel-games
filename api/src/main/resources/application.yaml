server:
  port: 8080

spring:
  application:
    name: boebel-games-api

  # Database connection configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/boebelgames
    username: postgres
    passward: password
    driver-class-name: org.postgresql.Driver

  # JPA-Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect




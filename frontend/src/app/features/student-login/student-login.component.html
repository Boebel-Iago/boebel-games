<div class="min-h-screen bg-gray-50 flex flex-col justify-center items-center font-sans p-4">
  
  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md text-center border border-gray-200">
    
    <h1 class="text-3xl font-bold text-forest-900 mb-2">Boebel Games</h1>
    <p class="text-gray-500 mb-8 text-sm">Digite o código de acesso fornecido pelo professor</p>

    <!-- Campo de Código (Mantive a letra grande e espaçada para facilitar a leitura) -->
    <div class="mb-6">
      <input
        type="text"
        [(ngModel)]="ticketCode"
        (keyup.enter)="onEnterGame()"
        maxlength="6"
        class="w-full text-center text-4xl font-bold tracking-[0.2em] uppercase border border-gray-300 rounded-lg py-4 focus:border-forest-900 focus:ring-1 focus:ring-forest-900 focus:outline-none transition-colors text-gray-800 placeholder-gray-300"
        placeholder="CÓDIGO"
      />
    </div>

    <!-- Mensagem de Erro (Usando o mesmo padrão de erro do dashboard) -->
    <div *ngIf="errorMessage" class="bg-red-50 text-red-600 p-3 rounded-lg mb-6 text-sm text-center">
      {{ errorMessage }}
    </div>

    <!-- Botão de Ação -->
    <button
      (click)="onEnterGame()"
      [disabled]="isLoading || ticketCode.length < 6"
      class="w-full py-4 bg-forest-900 hover:bg-forest-800 text-white font-bold text-lg rounded-lg transition-colors disabled:bg-gray-300 disabled:cursor-not-allowed">
      {{ isLoading ? 'Validando...' : 'Acessar Jogo' }}
    </button>

  </div>

  <!-- Link discreto para o login do professor -->
  <div class="mt-8 text-gray-500 text-sm">
    Área do Professor? <a routerLink="/login" class="text-forest-900 font-semibold hover:underline">Acesse aqui</a>
  </div>
</div>
